<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/output.css" />
    <title>Movement Form</title>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-8">
      <form id="movment-form" class="bg-white rounded-xl shadow-lg p-8">
        <section>
          <h2 class="text-4xl font-bold text-blue-600 text-center mb-8">
            Basic Information
          </h2>

          <div class="mb-6">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
              Movement Name
            </label>
            <input
              id="name"
              name="name"
              type="text"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 
              focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              required
            />
          </div>

          <div class="mb-6">
            <label for="summary" class="block text-sm font-medium text-gray-700 mb-2 ">
              Short Summary
              </label>
            <textarea
              id="summary"
              name="summary"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900
              focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              required
            ></textarea>
          </div>

          <div class="mb-6">
            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
              Full Description
            </label>
            <textarea
              id="description"
              name="description"
              rows="5"
              class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900
              focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              required
            ></textarea>
          </div>

          <fieldset class="mb-6">
            <legend class="block text-sm font-medium text-gray-700 mb-3">
              Execution Style
            </legend>
            <div>
              <label class="flex items-center gap-2 text-sm text-gray-700 ">
              <select id="execution" name="execution" class="w-auto rounded-lg border border-gray-300 
                      bg-white px-4 py-3 text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none
                      focus:ring-2 focus:ring-blue-200" >
                <option value="">Select a style</option>
                <option value="static">Static</option>
                <option value="dynamic">Dynamic</option>
              </select>
              </label>
            </div>
          </fieldset>

          <fieldset class="mb-6">
            <legend class="block text-sm font-medium text-gray-700 mb-3">
              Primary Skill Demands
            </legend>
            <div class="grid grid-cols-2 gap-1 sm:grid-cols-3">
              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="demand"
                  value="strength"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Strength</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="demand"
                  value="Power"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Power</span>
              </label>

               <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="demand"
                  value="Balance"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Balance</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="demand"
                  value="Coordination"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Coordination</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="demand"
                  value="Precision"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Precision</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="mb-6">
            <legend class="block text-sm font-medium text-gray-700 mb-3">
              Applicable Terrain Types
            </legend>
            <div class="grid grid-cols-2 gap-1 sm:grid-cols-3">
              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="terrain"
                  value="slab"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Slab</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="terrain"
                  value="vertical"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Vertical</span>
              </label>

               <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="terrain"
                  value="overhang"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Overhang</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="terrain"
                  value="roof"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Roof</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="terrain"
                  value="dihedral"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Dihedral</span>
              </label>

              <label class="flex items-center gap-2">
                <input
                  type="checkbox"
                  name="terrain"
                  value="arete"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                  <span class="text-gray-700 text-sm">Arete</span>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend class="block text-sm font-medium text-gray-700 mb-3">
              Entry Status
            </legend>
            <div>
              <label class="flex items-center gap-2 text-sm text-gray-700 ">
              <select id="status" name="status" class="w-auto rounded-lg border border-gray-300 
                      bg-white px-4 py-3 text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none
                      focus:ring-2 focus:ring-blue-200" required>
                <option value="">Select a Status</option>
                <option value="draft">Draft</option>
                <option value="needs-review">Needs Review</option>
                 <option value="published">Published</option>
              </select>
              </label>
            </div>
          </fieldset>
        </section>
      </form>

        <section>
          <h3 class="text-4xl font-bold text-blue-600 mb-6">
            Teaching Information
          </h3>

          <div>
            <label for="when-to-use">When to Use It</label>
            <textarea id="when-to-use" name="when-to-use" rows="4"></textarea>
          </div>

          <div>
            <label for="how-to-perform">How to Perform It</label>
            <textarea
              id="how-to-perform"
              name="how-to-perform"
              rows="6"
            ></textarea>
          </div>

          <div>
            <label for="common-mistakes">Common Mistakes</label>
            <textarea
              id="common-mistakes"
              name="common-mistakes"
              rows="5"
            ></textarea>
          </div>
        </section>

        <section>
          <h2>Organization</h2>

          <div>
            <label for="tags">Tags</label>
            <input
              id="tags"
              name="tags"
              type="text"
              placeholder="Example: balance, overhang, hip rotation"
            />
          </div>

          <p>Separate multiple tags with commas.</p>
        </section>

        <section>
          <h2>Internal Notes</h2>

          <div>
            <label for="research-notes">Research Notes</label>
            <textarea
              id="research-notes"
              name="research-notes"
              rows="5"
            ></textarea>
          </div>

          <div>
            <label for="extra-notes">Extra Notes</label>
            <textarea id="extra-notes" name="extra-notes" rows="5"></textarea>
          </div>
        </section>
        <!-- <form onsubmit="myCustomFunction(event)"> -->

        <button id="submitButton" type="submit">Create Movement</button>
      </form>

      <!-- create form ( name, difficulty, description, extraNotes) -->
      <!-- POST REQUEST to /movements -->
    </div>
  </body>
  <script src="./app.js"></script>
  <script>
    const movementForm = document.getElementById("movment-form");

    movementForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const movementData = {
        movementName: document.getElementById("name").value,
        movementSummary: document.getElementById("summary").value,
        movementDescription: document.getElementById("description").value,
        movementDifficulty: document.getElementById("difficulty").value,
        movementStatus: document.getElementById("status").value,
        movementWhenToUse: document.getElementById("when-to-use").value,
        movmentHowToPerform: document.getElementById("how-to-perform").value,
        movmentCommonMistakes: document.getElementById("common-mistakes").value,
        movmentTags: document.getElementById("tags").value,
        movementResearchNotes: document.getElementById("research-notes").value,
        movementExtraNotes: document.getElementById("extra-notes").value,
      };

      const response = await fetch("/movements", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(movementData),
      });

      const result = await response.json();
      console.log(result);
    });
  </script>
</html>
