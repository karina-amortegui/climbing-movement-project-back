services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    # env_file:
    # - .env
    ports:
      - 8787:8787
    depends_on:
      - mongo
    volumes:
      - ./server:/app

  mongo:
    image: mongo:latest
    volumes:
      - data:/data/db
    ports:
      - 27017:27017
    networks:
      - internal

  mongo-express:
    image: mongo-express
    restart: always
    networks:
      - internal
      - default
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: karina
      ME_CONFIG_BASICAUTH_PASSWORD: password

volumes:
  data:

networks:
  internal:
